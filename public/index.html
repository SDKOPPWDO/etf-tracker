<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 下跌加碼計算器</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111827;
    --card: #1a2235;
    --border: #1e3a5f;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --green: #00e676;
    --red: #ff3d5a;
    --yellow: #ffd600;
    --purple: #b388ff;
    --text: #e8f4ff;
    --muted: #6b8db8;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Noto Sans TC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255, 107, 53, 0.05) 0%, transparent 50%);
  }

  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(17, 24, 39, 0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -1px;
  }

  .logo span { color: var(--accent2); }

  header p {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  .main {
    max-width: 1300px;
    margin: 0 auto;
    padding: 32px 24px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  /* ETF Tabs */
  .etf-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .etf-btn {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 24px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .etf-btn:hover { border-color: var(--accent); color: var(--accent); }
  .etf-btn.active {
    border-color: var(--accent);
    background: rgba(0, 212, 255, 0.1);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
  }

  .etf-btn[data-etf="SMH"].active { border-color: var(--accent2); background: rgba(255,107,53,0.1); color: var(--accent2); box-shadow: 0 0 20px rgba(255,107,53,0.2); }
  .etf-btn[data-etf="00981A"].active { border-color: var(--yellow); background: rgba(255,214,0,0.1); color: var(--yellow); box-shadow: 0 0 20px rgba(255,214,0,0.2); }
  .etf-btn[data-etf="2454"].active { border-color: var(--purple); background: rgba(179,136,255,0.1); color: var(--purple); box-shadow: 0 0 20px rgba(179,136,255,0.2); }

  /* Price Panel */
  .price-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 24px;
    position: relative;
    overflow: hidden;
  }

  .price-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .price-stat { display: flex; flex-direction: column; gap: 6px; }
  .price-stat label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }

  .price-value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
  }

  .price-value.highlight { color: var(--accent); }
  .price-value.green { color: var(--green); }
  .price-value.red { color: var(--red); }

  .price-sub { font-size: 12px; color: var(--muted); }

  .fetch-btn {
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px 28px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: #000;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    white-space: nowrap;
    align-self: center;
  }

  .fetch-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.3); }
  .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .loading-dot {
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Drop Table */
  .section-title {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .drop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }

  .drop-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: all 0.2s;
    cursor: default;
    position: relative;
  }

  .drop-card:hover { border-color: rgba(0,212,255,0.4); transform: translateY(-2px); }

  .drop-pct {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .drop-pct.mild { color: var(--yellow); }
  .drop-pct.moderate { color: var(--accent2); }
  .drop-pct.deep { color: var(--red); }

  .drop-price {
    font-family: var(--font-mono);
    font-size: 18px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .drop-from-now {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .drop-from-now.below { color: var(--green); }
  .drop-from-now.above { color: var(--red); }

  /* Calculator */
  .calc-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .calc-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--yellow));
  }

  .calc-rows {
    display: grid;
    gap: 10px;
    margin-bottom: 20px;
  }

  .calc-row {
    display: grid;
    grid-template-columns: 80px 1fr 140px;
    gap: 12px;
    align-items: center;
  }

  .calc-label {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .calc-label.mild { color: var(--yellow); }
  .calc-label.moderate { color: var(--accent2); }
  .calc-label.deep { color: var(--red); }

  .calc-price-ref {
    font-size: 12px;
    color: var(--muted);
  }

  .calc-input {
    font-family: var(--font-mono);
    font-size: 15px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    text-align: right;
    width: 100%;
    transition: border-color 0.2s;
  }

  .calc-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  .calc-input::placeholder { color: var(--muted); }

  .calc-total {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .total-label {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .total-value {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 700;
    color: var(--green);
  }

  .clear-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  .status-bar {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .status-dot.error { background: var(--red); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .note {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    line-height: 1.6;
  }

  .note strong { color: var(--accent); }

  /* Currency toggle */
  .currency-toggle {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
  }

  .curr-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    background: transparent;
    border: none;
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .curr-btn.active { background: var(--accent); color: #000; font-weight: 700; }

  .top-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 600px) {
    .price-panel { grid-template-columns: 1fr 1fr; }
    .calc-row { grid-template-columns: 70px 1fr; }
    .calc-price-ref { display: none; }
    .price-value { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">ETF <span>DIP</span> TRACKER</div>
    <p>下跌加碼計算工具 · SMH / 00981A / VOO / 聯發科</p>
  </div>
</header>

<div class="main">

  <!-- Controls -->
  <div class="top-controls">
    <div class="etf-tabs" id="etfTabs">
      <button class="etf-btn active" data-etf="SMH" onclick="selectETF('SMH')">SMH</button>
      <button class="etf-btn" data-etf="00981A" onclick="selectETF('00981A')">00981A</button>
      <button class="etf-btn" data-etf="VOO" onclick="selectETF('VOO')">VOO</button>
      <button class="etf-btn" data-etf="2454" onclick="selectETF('2454')">聯發科 2454</button>
    </div>
    <div class="currency-toggle">
      <button class="curr-btn active" id="currUSD" onclick="setCurrency('USD')">USD</button>
      <button class="curr-btn" id="currTWD" onclick="setCurrency('TWD')">TWD</button>
    </div>
    <button class="fetch-btn" id="fetchBtn" onclick="fetchData()">▶ 抓取資料</button>
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">尚未載入</span>
    </div>
  </div>

  <!-- Price Panel -->
  <div class="price-panel">
    <div class="price-stat">
      <label>今日收盤</label>
      <div class="price-value highlight" id="priceClose">—</div>
      <div class="price-sub" id="priceChange">—</div>
    </div>
    <div class="price-stat">
      <label>歷史最高</label>
      <div class="price-value green" id="priceATH">—</div>
      <div class="price-sub" id="athDate">—</div>
    </div>
    <div class="price-stat">
      <label>距離 ATH</label>
      <div class="price-value" id="fromATH">—</div>
      <div class="price-sub">現價相對最高點</div>
    </div>
    <div class="price-stat">
      <label>資料來源</label>
      <div class="price-sub" style="font-size:12px; margin-top:6px; line-height:1.8;">
        Yahoo Finance API<br>
        <span style="color:var(--muted)">每日收盤後更新</span>
      </div>
    </div>
  </div>

  <!-- Drop Table -->
  <div>
    <div class="section-title">下跌價位對照表</div>
    <div class="drop-grid" id="dropGrid">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- Calculator -->
  <div class="calc-panel">
    <div class="section-title">加碼金額計算器</div>
    <div class="calc-rows" id="calcRows">
      <!-- filled by JS -->
    </div>
    <div class="calc-total">
      <div>
        <div class="total-label">總加碼金額</div>
        <div class="total-value" id="totalAmount">$0</div>
      </div>
      <button class="clear-btn" onclick="clearCalc()">清除全部</button>
    </div>
  </div>

  <!-- Note -->
  <div class="note">
    ℹ️ <strong>資料說明：</strong>
    SMH / VOO 為美股 ETF，價格以 <strong>USD</strong> 計。00981A 為台灣 ETF、聯發科（2454）為台股個股，價格以 <strong>TWD</strong> 計。
    歷史最高點（ATH）以近 <strong>5 年</strong> 最高收盤價為基準。本工具僅供參考，不構成投資建議。
    資料透過 Yahoo Finance 公開 API 取得，延遲約 15 分鐘。
  </div>

</div>

<script>
const ETF_CONFIG = {
  SMH: { symbol: 'SMH', name: 'VanEck Semiconductor ETF', currency: 'USD', decimals: 2 },
  '00981A': { symbol: '00981A.TW', name: '元大半導體', currency: 'TWD', decimals: 2 },
  VOO: { symbol: 'VOO', name: 'Vanguard S&P 500 ETF', currency: 'USD', decimals: 2 },
  '2454': { symbol: '2454.TW', name: '聯發科', currency: 'TWD', decimals: 2 },
};

const DROP_LEVELS = [10, 15, 20, 25, 30, 35, 40, 45];

let currentETF = 'SMH';
let currentCurrency = 'USD';
let state = {
  close: null,
  ath: null,
  athDate: null,
  change: null,
  changePct: null,
};

// --- CORS proxy list ---
const PROXY = 'https://corsproxy.io/?';

function selectETF(etf) {
  currentETF = etf;
  document.querySelectorAll('.etf-btn').forEach(b => b.classList.toggle('active', b.dataset.etf === etf));
  // auto-switch currency label
  const cfg = ETF_CONFIG[etf];
  setCurrency(cfg.currency);
  resetUI();
}

function setCurrency(c) {
  currentCurrency = c;
  document.getElementById('currUSD').classList.toggle('active', c === 'USD');
  document.getElementById('currTWD').classList.toggle('active', c === 'TWD');
}

function resetUI() {
  state = { close: null, ath: null, athDate: null, change: null, changePct: null };
  document.getElementById('priceClose').textContent = '—';
  document.getElementById('priceChange').textContent = '—';
  document.getElementById('priceATH').textContent = '—';
  document.getElementById('athDate').textContent = '—';
  document.getElementById('fromATH').textContent = '—';
  document.getElementById('dropGrid').innerHTML = '';
  buildCalcRows();
  setStatus('', '尚未載入');
}

function setStatus(type, msg) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (type ? ' ' + type : '');
  document.getElementById('statusText').textContent = msg;
}

function fmt(val, decimals = 2, currency = null) {
  if (val === null || isNaN(val)) return '—';
  const prefix = currency === 'TWD' ? 'NT$' : '$';
  return prefix + val.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

async function fetchData() {
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  btn.innerHTML = '載入中<span class="loading-dot">...</span>';
  setStatus('', '連線中...');

  const cfg = ETF_CONFIG[currentETF];
  const sym = cfg.symbol;

  try {
    // Fetch quote (close + change)
    const quoteUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`;
    const proxyUrl = PROXY + encodeURIComponent(quoteUrl);

    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const meta = data.chart.result[0].meta;
    const closePrice = meta.regularMarketPrice ?? meta.chartPreviousClose;
    const prevClose = meta.chartPreviousClose;
    const change = closePrice - prevClose;
    const changePct = (change / prevClose) * 100;

    state.close = closePrice;
    state.change = change;
    state.changePct = changePct;

    // Fetch 5Y history for ATH
    const histUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=5y`;
    const histProxyUrl = PROXY + encodeURIComponent(histUrl);
    const hRes = await fetch(histProxyUrl);
    const hData = await hRes.json();

    const closes = hData.chart.result[0].indicators.quote[0].close.filter(x => x !== null);
    const timestamps = hData.chart.result[0].timestamp;
    const maxClose = Math.max(...closes);
    const maxIdx = closes.indexOf(maxClose);
    const maxTs = timestamps[maxIdx];
    const maxDate = new Date(maxTs * 1000).toLocaleDateString('zh-TW');

    state.ath = maxClose;
    state.athDate = maxDate;

    setCurrency(cfg.currency);
    renderPrices();
    renderDropCards();
    buildCalcRows();

    const now = new Date().toLocaleTimeString('zh-TW');
    setStatus('live', `更新於 ${now}`);

  } catch (e) {
    console.error(e);
    setStatus('error', '載入失敗，請重試');
  }

  btn.disabled = false;
  btn.innerHTML = '▶ 重新抓取';
}

function renderPrices() {
  const cfg = ETF_CONFIG[currentETF];
  const curr = cfg.currency;
  const d = cfg.decimals;

  document.getElementById('priceClose').textContent = fmt(state.close, d, curr);

  const chg = state.change;
  const chgPct = state.changePct;
  const chgEl = document.getElementById('priceChange');
  const sign = chg >= 0 ? '+' : '';
  chgEl.textContent = `${sign}${fmt(chg, d, curr)} (${sign}${chgPct.toFixed(2)}%)`;
  chgEl.style.color = chg >= 0 ? 'var(--green)' : 'var(--red)';

  document.getElementById('priceATH').textContent = fmt(state.ath, d, curr);
  document.getElementById('athDate').textContent = `最高點：${state.athDate}`;

  const diff = ((state.close - state.ath) / state.ath) * 100;
  const fromEl = document.getElementById('fromATH');
  fromEl.textContent = `${diff.toFixed(2)}%`;
  fromEl.className = 'price-value ' + (diff < -20 ? 'red' : diff < -10 ? '' : 'green');
}

function getDropClass(pct) {
  if (pct <= 15) return 'mild';
  if (pct <= 30) return 'moderate';
  return 'deep';
}

function renderDropCards() {
  const cfg = ETF_CONFIG[currentETF];
  const curr = cfg.currency;
  const d = cfg.decimals;
  const ath = state.ath;
  const close = state.close;

  const grid = document.getElementById('dropGrid');
  grid.innerHTML = '';

  DROP_LEVELS.forEach(pct => {
    const targetPrice = ath * (1 - pct / 100);
    const diff = ((close - targetPrice) / targetPrice) * 100;
    const cls = getDropClass(pct);
    const diffLabel = diff >= 0
      ? `<span class="drop-from-now above">現價高出 +${diff.toFixed(1)}%</span>`
      : `<span class="drop-from-now below">現價已低於 ${diff.toFixed(1)}%</span>`;

    const card = document.createElement('div');
    card.className = 'drop-card';
    card.innerHTML = `
      <div class="drop-pct ${cls}">-${pct}%</div>
      <div class="drop-price">${fmt(targetPrice, d, curr)}</div>
      <div style="font-size:11px;color:var(--muted);">from ATH ${fmt(ath, d, curr)}</div>
      ${diffLabel}
    `;
    grid.appendChild(card);
  });
}

function buildCalcRows() {
  const cfg = ETF_CONFIG[currentETF];
  const curr = cfg.currency;
  const d = cfg.decimals;
  const ath = state.ath;

  const rows = document.getElementById('calcRows');
  rows.innerHTML = '';

  DROP_LEVELS.forEach(pct => {
    const targetPrice = ath ? ath * (1 - pct / 100) : null;
    const cls = getDropClass(pct);
    const priceRef = targetPrice ? fmt(targetPrice, d, curr) : '—';

    const row = document.createElement('div');
    row.className = 'calc-row';
    row.innerHTML = `
      <div class="calc-label ${cls}">-${pct}%</div>
      <div class="calc-price-ref">${priceRef}</div>
      <input class="calc-input" type="number" min="0" step="100"
        placeholder="輸入金額" data-pct="${pct}"
        oninput="calcTotal()" />
    `;
    rows.appendChild(row);
  });

  calcTotal();
}

function calcTotal() {
  const inputs = document.querySelectorAll('.calc-input');
  let total = 0;
  inputs.forEach(inp => {
    const val = parseFloat(inp.value);
    if (!isNaN(val) && val > 0) total += val;
  });

  const cfg = ETF_CONFIG[currentETF];
  const prefix = cfg.currency === 'TWD' ? 'NT$' : '$';
  document.getElementById('totalAmount').textContent =
    prefix + total.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function clearCalc() {
  document.querySelectorAll('.calc-input').forEach(i => i.value = '');
  calcTotal();
}

// Init
resetUI();
</script>
</body>
</html>
